version: 2
models:
  - name: stg_telco__customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: contract
        data_tests:
          - accepted_values:
              arguments:
                values: [Month-to-month, One year, Two year]
  - name: stg_usage__monthly
    data_tests:
      - unique_combination:
          arguments:
            columns: [customer_id, usage_month]
    columns:
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_telco__customers')
                field: customer_id
